<svg xmlns="http://www.w3.org/2000/svg" width="768" height="768" viewBox="360 100 820 820" role="img" aria-label="Reflectiv: two overlapping glass panes">
<defs>
 <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--reflectiv-start, #c5e2ff)"/><stop offset="1" stop-color="var(--reflectiv-end, #72a6ff)"/></linearGradient>
 <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--reflectiv-start, #c5e2ff)"/><stop offset="1" stop-color="var(--reflectiv-end, #72a6ff)"/></linearGradient>
 <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1"><stop stop-color="white" stop-opacity=".42"/><stop offset="1" stop-color="white" stop-opacity=".07"/></linearGradient>
 <filter id="halo" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="40"/></filter>
 <clipPath id="front"><rect x="530" y="333" width="397" height="382" rx="72"/></clipPath>
</defs>
<g id="glow" opacity="var(--reflectiv-glow, .65)" filter="url(#halo)" fill="url(#glass)"><rect x="641" y="240" width="391" height="383" rx="72"/><rect x="530" y="333" width="410" height="395" rx="72"/></g>
<g id="rear-pane"><rect x="641" y="240" width="391" height="383" rx="72" fill="url(#edge)"/><rect x="641" y="240" width="379" height="372" rx="72" fill="url(#glass)"/><rect x="641" y="240" width="379" height="372" rx="72" fill="url(#shine)" stroke="white" stroke-opacity=".18"/></g>
<g id="front-pane"><rect x="530" y="333" width="410" height="395" rx="72" fill="url(#edge)"/><rect x="530" y="333" width="397" height="382" rx="72" fill="url(#glass)"/><rect x="530" y="333" width="397" height="382" rx="72" fill="url(#shine)" stroke="white" stroke-opacity=".22"/><g clip-path="url(#front)"><rect x="641" y="240" width="391" height="383" rx="72" fill="var(--reflectiv-overlap, var(--reflectiv-end, #72a6ff))" opacity=".35"/></g></g>
</svg>